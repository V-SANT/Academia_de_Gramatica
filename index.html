<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002776" />
    <title>Academia de Gramática</title>
    <script>
      // Aplica o tema antes do primeiro paint, para não haver um "flash" branco
      // ao abrir a app em modo escuro.
      // A chave "ga_theme" também está em src/lib/theme.js — se mudares o nome,
      // muda nos dois sítios.
      (function () {
        try {
          var t = localStorage.getItem("ga_theme");
          var escuro =
            t === "dark" ||
            ((t === "system" || !t) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage bloqueado (ex.: modo privado) — segue com o tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
